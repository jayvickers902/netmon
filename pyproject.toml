[project]
name = "netmon"
version = "0.1.0"
description = "Home network monitoring: device discovery, connection health, bandwidth"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psutil>=6.1",
    "dnspython>=2.7",
]

[project.scripts]
netmon = "netmon.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` tests touch the real network and are excluded by default. Run them
# explicitly with: pytest -m live
addopts = "-m 'not live' --strict-markers --cov=netmon --cov-report=term-missing --cov-fail-under=80"
markers = [
    "live: test requires real network access (excluded from default run and CI)",
]

[tool.coverage.run]
source = ["src/netmon"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
