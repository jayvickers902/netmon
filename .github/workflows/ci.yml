name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # netmon targets Windows: it installs as a Task Scheduler job, pings via
    # IcmpSendEcho, reads the ARP cache via GetIpNetTable, and notifies through
    # Windows toasts. Checking on Linux would type-check a configuration that is
    # never shipped, and would leave the ctypes paths that actually run untested.
    runs-on: windows-latest
    steps:
      # All three pinned to v7, the first major of each that runs on Node 24.
      # setup-uv publishes no floating v8/v9 tag — only exact versions — so v7 is
      # the newest tag that tracks patches here, despite 9.x existing.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
