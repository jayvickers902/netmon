# netmon configuration. Copy to netmon.toml and edit.
# netmon.toml is gitignored — it holds your local network details.

[server]
host = "127.0.0.1"
port = 8787

[api]
# Loopback requests stay unauthenticated so the existing local dashboard needs no login.
# This is deliberate: anyone with a local shell already has access to the SQLite file.
allow_loopback_unauthenticated = true
# Set this for LAN access. Use `netmon gen-token`; never put a token in a query string,
# because URLs are copied into browser history and server/proxy logs.
# token = "paste-generated-token-here"

[database]
path = "data/netmon.db"

[discovery]
# Subnets to sweep. Leave empty to auto-detect from the host's interfaces.
subnets = []
# Seconds between full sweeps. Keep this gentle; aggressive sweeping annoys
# sleeping devices and some IoT gear responds badly to it.
interval_seconds = 300
# Consider a device offline after this many consecutive missed sweeps.
offline_after_misses = 3

[latency]
interval_seconds = 10
# "gateway" is resolved at runtime to the host's default gateway.
targets = ["gateway", "1.1.1.1", "8.8.8.8"]
# Samples per collection, used to derive jitter and loss.
probes_per_sample = 5
timeout_ms = 1000

[dns]
interval_seconds = 60
resolvers = ["1.1.1.1", "8.8.8.8"]
query_names = ["example.com", "cloudflare.com"]

[http]
interval_seconds = 60
urls = ["https://www.google.com/generate_204"]
timeout_seconds = 5

[outage]
# An outage is declared only after failures persist. Single dropped packets are
# normal and should not page you.
failures_to_open = 3
successes_to_close = 2
# Capture a traceroute when an outage opens.
traceroute_on_open = true
traceroute_timeout_seconds = 30
traceroute_max_hops = 30

[wan]
# UPnP WAN connection status only; this router does not provide byte counters.
# Leave gateway and lan_ip empty to derive them from the host's default route.
enabled = true
interval_seconds = 30
# gateway = "192.168.4.1"
# lan_ip = "192.168.4.143"

[hitron]
# Read-only DOCSIS status from the bridged Hitron modem.
enabled = true
interval_seconds = 30
base_url = "http://192.168.100.1"
timeout_seconds = 5

[speedtest]
# Saturates the link while running — keep this infrequent.
enabled = false
interval_seconds = 21600  # 6 hours
# Saturates the link while running; keep it infrequent because the test itself affects health.
endpoint = "https://speed.cloudflare.com"
download_bytes = 10000000
upload_bytes = 10000000
# A hard cap prevents a slow or misconfigured endpoint from turning one run into a flood.
max_bytes = 50000000
total_time_budget_seconds = 120

[host_nic]
# This is local-machine traffic, not total WAN utilisation or other devices' traffic.
enabled = true
interval_seconds = 10
# psutil cannot provide per-process byte counters on Windows, so zero is honest by default.
top_processes = 0

[eero]
# Cloud usage is reverse-engineered and disappears during an internet outage; opt in deliberately.
enabled = false
interval_seconds = 60
token_path = "data/eero.token"
base_url = "https://api-user.e2ro.com"
# `netmon eero-login` lists the IDs available to the authenticated account.
# Leave unset only when the account has exactly one network.
# network_id = "123456"

[managed_hosts]
# Opt-in SSH telemetry for Windows devices you administer. It is not passive network capture.
enabled = false
interval_seconds = 30
# Each host needs an SSH server configured for key-only authentication. Verify the host key first;
# netmon requires StrictHostKeyChecking and never accepts a new key interactively.
# [[managed_hosts.hosts]]
# name = "office-pc"
# address = "192.168.4.50"
# username = "netmon"
# identity_file = "C:/Users/you/.ssh/netmon_ed25519"
# port = 22
# timeout_seconds = 10
# adapter_name = "Ethernet"
# expected_mac = "aa:bb:cc:dd:ee:ff"
# NIC counters include LAN traffic to this device and are not total WAN throughput.

[investigation]
# Investigation mode raises diagnostic poll rates for a bounded window, pauses speedtests,
# and then classifies whether bad latency came from local hardware, upload contention, or WAN.
enabled = true
# Fifteen minutes is long enough to catch a recurring slowdown without making an investigation
# an unattended background job. The server-side maximum prevents unexpectedly long runs.
default_duration_seconds = 900
max_duration_seconds = 3600
# This 10 Mbps uplink is the whole reason this feature exists: the link is roughly 10 Mbps up
# but very fast down, so upload is the scarce resource worth watching for bufferbloat.
uplink_mbps = 10.0
# Download capacity is informational here; it is not the suspected bottleneck on this link.
downlink_mbps = 500.0
# At least 80% of the configured uplink capacity counts as saturation in degraded buckets.
saturation_fraction = 0.8
# Compare internet and gateway RTT against their quiet baselines to separate symptoms from causes.
latency_degraded_ms = 50.0
gateway_degraded_ms = 30.0
loss_degraded_fraction = 0.05
# Ten-second buckets make latency degradation and upload samples comparable for correlation.
bucket_seconds = 10.0
# A speedtest deliberately fills the uplink, so it must be paused while measuring contention.
suppress_speedtest = true
# Automatic investigations are opt-in; manual investigations remain the default workflow.
auto_arm = false
auto_arm_duration_seconds = 600
auto_arm_cooldown_seconds = 1800

[investigation.burst_intervals]
# Faster sampling improves the diagnosis, but these floors keep the burst gentle on dependencies.
latency = 2.0
dns = 30.0
http = 30.0
wan = 10.0
host_nic = 2.0
# The eero endpoint is undocumented and unrate-limited; 30 seconds is a project non-negotiable.
eero = 30.0
# The Hitron is an embedded modem whose day job is keeping the house online; keep this gentle.
hitron = 30.0
# SSH round-trips to Windows need headroom; do not burst this below five seconds.
managed_hosts = 10.0

[retention]
# Raw data is kept for a week; older data is compacted before deletion to protect disk use.
raw_days = 7
# These tiers must stay ordered; each coarser tier is built only from verified finer data.
rollup_1m_days = 30
rollup_5m_days = 365

[alerts]
enabled = true
# Cool-down prevents a flapping condition from producing a notification storm.
interval_seconds = 5
cooldown_seconds = 3600
windows_toast = true
# Add [[alerts.rules]] entries deliberately; no threshold is assumed for every metric.
# [[alerts.rules]]
# name = "gateway latency"
# metric_kind = "latency_rtt_ms"
# target = "gateway"
# source = "local"
# operator = ">"
# threshold = 200
# failures_to_open = 3
# successes_to_close = 2
# severity = "warning"
# Sustained estimated upload near 80% of a 10 Mbps uplink (requires [eero].enabled = true):
# [[alerts.rules]]
# name = "uplink nearing capacity"
# metric_kind = "wan_upstream_estimated_rate"
# target = "wan"
# source = "eero_cloud"
# operator = ">="
# threshold = 1000000
# failures_to_open = 2
# successes_to_close = 2
# severity = "warning"
# Sustained modem management-path failure:
# [[alerts.rules]]
# name = "modem unavailable"
# metric_kind = "modem_available"
# target = "modem"
# source = "hitron"
# operator = "<"
# threshold = 0.5
# failures_to_open = 2
# successes_to_close = 2
# severity = "warning"
# Sustained downstream errors that could indicate coax/plant trouble:
# [[alerts.rules]]
# name = "DOCSIS uncorrectable errors"
# metric_kind = "docsis_uncorrectable_rate"
# target = "modem"
# source = "hitron"
# operator = ">="
# threshold = 1.0
# failures_to_open = 2
# successes_to_close = 2
# severity = "warning"
# Poll latency is the complete parallel Hitron status fetch; tune this above the modem's baseline:
# [[alerts.rules]]
# name = "modem response slow"
# metric_kind = "modem_poll_latency_ms"
# target = "modem"
# source = "hitron"
# operator = ">="
# threshold = 2500
# failures_to_open = 3
# successes_to_close = 2
# severity = "warning"
# webhook_url = "https://..."

[throttle]
# No enforcement backend exists yet; see ROADMAP v1.1.
backend = "null"
